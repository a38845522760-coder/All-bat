name: Build All Bat APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          test -s all-bat-android-source.zip

          mkdir -p /tmp/allbat-source
          unzip -q all-bat-android-source.zip -d /tmp/allbat-source

          test -d /tmp/allbat-source/all-bat-android

          cp -a /tmp/allbat-source/all-bat-android/. .

          test -f app/build.gradle.kts
          test -f scripts/prepare_web_assets.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile scripts/prepare_web_assets.py

          node --check app/src/main/assets/native-bridge.js

      - name: Prepare web assets
        shell: bash
        run: |
          set -euo pipefail

          python scripts/prepare_web_assets.py

          test -s app/src/main/assets/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon clean assembleDebug --stacktrace

          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: all-bat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
