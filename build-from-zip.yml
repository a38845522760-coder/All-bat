name: Build APK from ZIP

# Put this file at .github/workflows/build-from-zip.yml and upload the project ZIP
# (for example all-bat-offline-android.zip) to the root of the repository.
# Every push re-extracts the ZIP and builds the APK.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract the project ZIP
        run: |
          set -euo pipefail
          zip_file="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
          if [ -z "$zip_file" ]; then
            echo "::error::No .zip file found in the repository root. Upload the project ZIP next to the .github folder."
            exit 1
          fi
          echo "Using $zip_file"
          rm -rf "$RUNNER_TEMP/project"
          mkdir -p "$RUNNER_TEMP/project"
          unzip -q "$zip_file" -d "$RUNNER_TEMP/project"
          settings="$(find "$RUNNER_TEMP/project" -maxdepth 3 -name settings.gradle.kts | head -n 1)"
          if [ -z "$settings" ]; then
            echo "::error::settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi
          project_dir="$(dirname "$settings")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Project folder: $project_dir"
          ls -la "$project_dir"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_COMPILE_SDK}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use private signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ALLBAT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/allbat-private.p12"
            echo "ALLBAT_KEYSTORE_FILE=$RUNNER_TEMP/allbat-private.p12" >> "$GITHUB_ENV"
            echo "Using the private keystore from repository secrets."
          else
            echo "Using the keystore that is inside the ZIP."
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ALLBAT_KEYSTORE_PASSWORD: ${{ secrets.ALLBAT_KEYSTORE_PASSWORD }}
          ALLBAT_KEY_ALIAS: ${{ secrets.ALLBAT_KEY_ALIAS }}
        run: |
          # Empty secrets must not override the defaults.
          [ -z "${ALLBAT_KEYSTORE_PASSWORD:-}" ] && unset ALLBAT_KEYSTORE_PASSWORD
          [ -z "${ALLBAT_KEY_ALIAS:-}" ] && unset ALLBAT_KEY_ALIAS
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
